name: Build Geode Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: InputBuffer
          path: ${{ steps.build.outputs.build-output }}
